<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pokémon Eclipse: Aurelia Genesis</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="gameframe">
    <canvas id="game" width="960" height="720"></canvas>
    <div id="hud">
      <div id="location" class="hud-chip"></div>
      <div id="partyHud" class="hud-chip"></div>
    </div>
    <div id="dialogue" class="hidden">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgArrow">▼</div>
    </div>
    <div id="overlay"></div>
    <div id="flash"></div>
    <div id="toast"></div>
    <div id="fade"></div>
  </div>
  <nav id="touch-controls" aria-label="Touch game controls">
    <div class="touch-dpad" aria-label="Movement">
      <button type="button" class="touch-key touch-up" data-key="ArrowUp" data-hold aria-label="Move up">▲</button>
      <button type="button" class="touch-key touch-left" data-key="ArrowLeft" data-hold aria-label="Move left">◀</button>
      <span class="touch-center" aria-hidden="true">✦</span>
      <button type="button" class="touch-key touch-right" data-key="ArrowRight" data-hold aria-label="Move right">▶</button>
      <button type="button" class="touch-key touch-down" data-key="ArrowDown" data-hold aria-label="Move down">▼</button>
    </div>
    <div class="touch-actions">
      <button type="button" class="touch-key touch-menu" data-key="x" aria-label="Open or close menu">Menu</button>
      <button type="button" class="touch-key touch-confirm" data-key="z" aria-label="Interact or confirm">A</button>
    </div>
  </nav>
  <div id="hint">Arrows / WASD move &nbsp;·&nbsp; Z / Enter interact &nbsp;·&nbsp; X / Esc menu &nbsp;·&nbsp; M mute</div>
</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/maps.js"></script>
<script src="js/art.js"></script>
<script src="js/artprops.js"></script>
<script src="js/artchars.js"></script>
<script src="js/artscene.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
