<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon Eclipse: Aurelia Genesis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="gameframe">
    <canvas id="game" width="960" height="720"></canvas>
    <div id="hud">
      <div id="location" class="hud-chip"></div>
      <div id="partyHud" class="hud-chip"></div>
    </div>
    <div id="dialogue" class="hidden">
      <div id="dlgName"></div>
      <div id="dlgText"></div>
      <div id="dlgArrow">▼</div>
    </div>
    <div id="overlay"></div>
    <div id="flash"></div>
    <div id="toast"></div>
    <div id="fade"></div>
  </div>
  <div id="hint">Arrows / WASD move &nbsp;·&nbsp; Z / Enter interact &nbsp;·&nbsp; X / Esc menu &nbsp;·&nbsp; M mute</div>
</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/maps.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/world.js"></script>
<script src="js/main.js"></script>
</body>
</html>
